<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra de Post-its interactivos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="pizarra" style="display: none;">
        <h1 id="titulo-pizarra">Pizarra de Post-its</h1>
        <div id="fondo"></div>

        <button id="añadir">+</button>

        <div id="edicion" style="display: none;">
            <h3>Post-it</h3>
            <input id="texto-postit" type="text" placeholder="Escribe tu nota aqui...">
            <div>
                <label>Color:</label>
                <input type="color" id="color-postit">
            </div>
            <button id="btn-guardar">Guardar</button>
            <button id="btn-cancelar">Cancelar</button>
        </div>
    </div>

    <div id="login">
        <div class="cabecera">
            <h2>Bienvenido</h2>
            <p>Ingresa tus datos para continuar</p>
        </div>

        <button type="button" class="btn-google" id="btn-google">
            <img src="https://img.icons8.com/color/1200/google-logo.jpg" alt="Logo de Google" class="google-icon">
            Continuar con Google
        </button>

        <div class="dividir">
            <p>o con tu correo</p>
        </div>

        <form action="#" method="POST" class="login-form">
            <div class="input">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" required>
            </div>

            <div class="input">
                <div class="password-header">
                    <label for="password">Contraseña</label>
                </div>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="button" class="btn-submit" id="iniciar">Iniciar sesión</button>
            <button type="button" class="btn-submit" id="registrar">Registrarse</button>
        </form>

    </div>




    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore,getDoc, deleteDoc, doc, collection, addDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        export const firebaseConfig = {
            apiKey: "AIzaSyCKNSLFrjUspMKzE7pbVGaYxGGYJ9WUAdo",
            authDomain: "ejercicios-firestore-6ab63.firebaseapp.com",
            projectId: "ejercicios-firestore-6ab63",
            storageBucket: "ejercicios-firestore-6ab63.firebasestorage.app",
            messagingSenderId: "718827856706",
            appId: "1:718827856706:web:e8fc3c95ce2ccae5ca9edb",
            measurementId: "G-F964LT31QN"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        

        //Recojo todos los id de la pizarra en variables
        const pizarra = document.getElementById("pizarra");
        const fondo = document.getElementById("fondo");
        const btnAñadir = document.getElementById("añadir");
        const edicion = document.getElementById("edicion");
        const textoPostit = document.getElementById("texto-postit");
        const colorPostit = document.getElementById("color-postit");
        const btnGuardar = document.getElementById("btn-guardar");
        const btnCancelar = document.getElementById("btn-cancelar"); 

        //Recojo todos los id del login en variables
        const login = document.getElementById("login");
        const btnGoogle = document.getElementById("btn-google");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const iniciar = document.getElementById("iniciar")
        const registrar = document.getElementById("registrar")



        //Evento para el boton de creación
        btnAñadir.addEventListener("click", () => {
            textoPostit.value = "";  
            colorPostit.value = "#fef08a";
            edicion.style.display = "block";
        });

        //Evento para ocultar el post it al pulsar cancelar
        btnCancelar.addEventListener("click", () => {
            edicion.style.display = "none";
        });

        //Evento para guardar la nota dentro de firebase
        async function guardarPostIt(e) {
            const texto = textoPostit.value.trim();
            const color = colorPostit.value;

            if (idActualizar) {
                await updateDoc(doc(db, "Tablero", idActualizar), {
                    texto: texto,
                    color: color
                });
                idActualizar = null;
            }

            else{
                let info = await getDocs(collection(db, "Tablero"));
                const totalNotas = info.size;
                const nuevoId = totalNotas + 1;

                const posX = 100;
                const posY = 100;

                await addDoc(collection(db, "Tablero"), {
                    id: nuevoId,
                    texto: texto,
                    color: color,
                    coordenadaX: posX,
                    coordenadaY: posY,
                    fechaCreacion: new Date()
                });
            }
            
            edicion.style.display = "none";

            leerNotas();
        };

        btnGuardar.addEventListener("click", guardarPostIt);

        async function leerNotas() {
            const misDatos = await getDocs(collection(db, "Tablero"));
            let listaDatos = misDatos.docs;

            fondo.innerHTML = "";

            for (let doc of listaDatos) {
                let documento = doc.data();

                fondo.innerHTML += `
                    <div class="postit" 
                        id="postit-${doc.id}"
                        ontouchstart="moverNota(event, this, '${doc.id}')"
                        ondblclick="editarNota('${doc.id}')"
                        style="left: ${documento.coordenadaX}px; top: ${documento.coordenadaY}px; background-color: ${documento.color};">
                            <p>${documento.texto}</p>
                    </div>
                `;
            }
        }

        leerNotas();

        window.moverNota = function (e, elemento, idDoc) {
            let touch = e.touches[0];
            let rect = elemento.getBoundingClientRect();
            
            let offsetX = touch.clientX - rect.left;
            let offsetY = touch.clientY - rect.top;

            //ESTO ES PARA EL DESLIZAMIENTO
            let inicioX = touch.clientX;
            let desplazamientoHorizontal = 0;

            function mover(e) {
                e.preventDefault();
                let toqueActual = e.touches[0];

                desplazamientoHorizontal = toqueActual.clientX - inicioX;

                elemento.style.left = (toqueActual.clientX - offsetX) + "px";
                elemento.style.top = (toqueActual.clientY - offsetY) + "px";
            }

            async function finalizar() {
                document.removeEventListener("touchmove", mover);
                document.removeEventListener("touchend", finalizar);

                if (Math.abs(desplazamientoHorizontal) > 100) {
                    window.borrarNota(idDoc, elemento);
                } else {
                    await updateDoc(doc(db, "Tablero", idDoc), {
                        coordenadaX: parseInt(elemento.style.left),
                        coordenadaY: parseInt(elemento.style.top)
                    });
                }
            }

            document.addEventListener("touchmove", mover, { passive: false });
            document.addEventListener("touchend", finalizar);
        };
        
        let idActualizar = null;
        window.editarNota = async function (idDoc) {
            idActualizar = idDoc;

            let miDoc = await getDoc(doc(db, "Tablero", idDoc));
            let datosNota = miDoc.data();

            textoPostit.value = datosNota.texto;
            colorPostit.value = datosNota.color;
            edicion.style.display = "block";
        };

        window.borrarNota = async function (idDoc, elemento) {
            const aceptar = confirm("¿Estás seguro de que quieres eliminar este post-it?");

            if (aceptar) {
                await deleteDoc(doc(db, "Tablero", idDoc));
                leerNotas();
            } else {
                elemento.style.transform = "translateX(0px)";
            }
        };

        function registrarse(){
            const auth = getAuth();
                createUserWithEmailAndPassword(auth, email.value.trim(), password.value)
                .then((userCredential) => {
                    // Signed up 
                    const user = userCredential.user;
                    login.style.display = "none";
                    pizarra.style.display = "block";
                })
                .catch((error) => {
                    console.log(error.code, error.message);
                    alert("Error: " + error.message);
                });
        }

        function iniciarSesion(){
            const auth = getAuth();
                signInWithEmailAndPassword(auth, email.value.trim(), password.value)
                .then((userCredential) => {
                    // Signed in 
                    const user = userCredential.user;
                    login.style.display = "none";
                    pizarra.style.display = "block";
                })
                .catch((error) => {
                    console.log(error.code, error.message);
                    alert("Error: " + error.message);
                });
        }

        function iniciarGoogle(){
            const auth = getAuth();
                signInWithPopup(auth, provider)
                .then((result) => {
                    // This gives you a Google Access Token. You can use it to access the Google API.
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    const token = credential.accessToken;
                    // The signed-in user info.
                    const user = result.user;
                    // IdP data available using getAdditionalUserInfo(result)
                    login.style.display = "none";
                    pizarra.style.display = "block";
                    // ...
                }).catch((error) => {
                    // Handle Errors here.
                    console.log(error.code, error.message);
                    alert("Error: " + error.message);
                    // The email of the user's account used.
                    const email = error.customData.email;
                    // The AuthCredential type that was used.
                    const credential = GoogleAuthProvider.credentialFromError(error);
                    // ...
                });
        }

        registrar.addEventListener("click",registrarse);
        
        iniciar.addEventListener("click",iniciarSesion);

        btnGoogle.addEventListener("click",iniciarGoogle);

    </script>
</body>
</html>
