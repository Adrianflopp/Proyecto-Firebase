<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra de Post-its interactivos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="titulo-pizarra">Pizarra de Post-its</h1>
    <div id="fondo"></div>

    <button id="añadir">+</button>

    <div id="edicion" style="display: none;">
        <h3>Post-it</h3>
        <input id="texto-postit" type="text" placeholder="Escribe tu nota aqui...">
        <div>
            <label>Color:</label>
            <input type="color" id="color-postit">
        </div>
        <button id="btn-guardar">Guardar</button>
        <button id="btn-cancelar">Cancelar</button>
    </div>






    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore,getDoc, deleteDoc, doc, collection, addDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        import { firebaseConfig } from "./config.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        //Recojo todos los id en variables
        const fondo = document.getElementById("fondo");
        const btnAñadir = document.getElementById("añadir");
        const edicion = document.getElementById("edicion");
        const textoPostit = document.getElementById("texto-postit");
        const colorPostit = document.getElementById("color-postit");
        const btnGuardar = document.getElementById("btn-guardar");
        const btnCancelar = document.getElementById("btn-cancelar"); 

        //Evento para el boton de creación
        btnAñadir.addEventListener("click", () => {
            textoPostit.value = "";  
            colorPostit.value = "#fef08a";
            edicion.style.display = "block";
        });

        //Evento para ocultar el post it al pulsar cancelar
        btnCancelar.addEventListener("click", () => {
            edicion.style.display = "none";
        });

        //Evento para guardar la nota dentro de firebase
        async function guardarPostIt(e) {
            const texto = textoPostit.value.trim();
            const color = colorPostit.value;

            if (idActualizar) {
                await updateDoc(doc(db, "Tablero", idActualizar), {
                    texto: texto,
                    color: color
                });
                idActualizar = null;
            }

            else{
                let info = await getDocs(collection(db, "Tablero"));
                const totalNotas = info.size;
                const nuevoId = totalNotas + 1;

                const posX = 100;
                const posY = 100;

                await addDoc(collection(db, "Tablero"), {
                    id: nuevoId,
                    texto: texto,
                    color: color,
                    coordenadaX: posX,
                    coordenadaY: posY,
                    fechaCreacion: new Date()
                });
            }
            
            edicion.style.display = "none";

            leerNotas();
        };

        btnGuardar.addEventListener("click", guardarPostIt);

        async function leerNotas() {
            const misDatos = await getDocs(collection(db, "Tablero"));
            let listaDatos = misDatos.docs;

            fondo.innerHTML = "";

            for (let doc of listaDatos) {
                let documento = doc.data();

                fondo.innerHTML += `
                    <div class="postit" 
                        id="postit-${doc.id}"
                        ontouchstart="moverNota(event, this, '${doc.id}')"
                        ondblclick="editarNota('${doc.id}')"
                        style="left: ${documento.coordenadaX}px; top: ${documento.coordenadaY}px; background-color: ${documento.color};">
                            <p>${documento.texto}</p>
                    </div>
                `;
            }
        }

        leerNotas();

        window.moverNota = function (e, elemento, idDoc) {
            let touch = e.touches[0];
            let rect = elemento.getBoundingClientRect();
            
            let offsetX = touch.clientX - rect.left;
            let offsetY = touch.clientY - rect.top;

            //ESTO ES PARA EL DESLIZAMIENTO
            let inicioX = touch.clientX;
            let desplazamientoHorizontal = 0;

            function mover(e) {
                e.preventDefault();
                let toqueActual = e.touches[0];

                desplazamientoHorizontal = toqueActual.clientX - inicioX;

                elemento.style.left = (toqueActual.clientX - offsetX) + "px";
                elemento.style.top = (toqueActual.clientY - offsetY) + "px";
            }

            async function finalizar() {
                document.removeEventListener("touchmove", mover);
                document.removeEventListener("touchend", finalizar);

                if (Math.abs(desplazamientoHorizontal) > 100) {
                    window.borrarNota(idDoc, elemento);
                } else {
                    await updateDoc(doc(db, "Tablero", idDoc), {
                        coordenadaX: parseInt(elemento.style.left),
                        coordenadaY: parseInt(elemento.style.top)
                    });
                }
            }

            document.addEventListener("touchmove", mover, { passive: false });
            document.addEventListener("touchend", finalizar);
        };
        
        let idActualizar = null;
        window.editarNota = async function (idDoc) {
            idActualizar = idDoc;

            let miDoc = await getDoc(doc(db, "Tablero", idDoc));
            let datosNota = miDoc.data();

            textoPostit.value = datosNota.texto;
            colorPostit.value = datosNota.color;
            edicion.style.display = "block";
        };

        window.borrarNota = async function (idDoc, elemento) {
            const aceptar = confirm("¿Estás seguro de que quieres eliminar este post-it?");

            if (aceptar) {
                await deleteDoc(doc(db, "Tablero", idDoc));
                leerNotas();
            } else {
                elemento.style.transform = "translateX(0px)";
            }
        };
    </script>
</body>
</html>
